name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: CLI smoke test
        run: safeguard-pq assess --scenario icu_gateway_critical

  frontend:
    name: Frontend build + browser E2E
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e "backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e-report
          retention-days: 7

  reproduce:
    # Re-runs every experiment that needs no third-party data (paper E1-E5, E4 solver quality, E7, E8, E9, the
    # synthetic dataset, E10 on it, and the supplementary E11 and E12) and fails if any deterministic value differs
    # from the committed artifacts. E6 and E10 P1/P2 need the CICIoMT2024 files, which are not redistributed, and are
    # reported as NOT RUN. Experiment numbers follow the journal paper.
    name: Reproduce results (benchmarks/run_all.py --check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The artifacts were recorded with 3.13.5 on Windows, which has no build for ubuntu-latest (26.04); the check
          # runs on the newest 3.13 release, so it also tests reproducibility across OS and patch version.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      # highspy pinned to the HiGHS version that produced the recorded E8 artifact.
      - run: pip install -e "backend[dev,benchmark]" "highspy==1.16.0"
      - name: Re-run the experiments and compare with the committed artifacts
        shell: bash
        run: python benchmarks/run_all.py --check --no-figures --no-docx 2>&1 | tee reproduce.log
      - name: Upload the regenerated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-results
          path: |
            reproduce.log
            benchmarks/results/
            datasets/synthetic_holdout/
          retention-days: 30

  citation:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cffconvert
      - run: cffconvert --validate
