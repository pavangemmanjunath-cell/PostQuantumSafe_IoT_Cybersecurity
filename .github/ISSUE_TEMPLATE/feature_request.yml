name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed capability }
    validations: { required: true }
  - type: textarea
    id: usecase
    attributes: { label: Use case, description: Who would use it and how? }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: justification
    attributes: { label: Technical / research justification, description: References, standards or evidence where relevant }
